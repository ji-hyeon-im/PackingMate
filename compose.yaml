services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: packingmate:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: "jdbc:postgresql://db:5432/${DB_NAME:-packingmate}"
      DB_USERNAME: "${DB_USERNAME:-packingmate}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}"
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${DB_NAME:-packingmate}"
      POSTGRES_USER: "${DB_USERNAME:-packingmate}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
